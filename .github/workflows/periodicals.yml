name: Collect & publish periodicals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/app/press_registry.py"
      - "backend/scripts/monitor_press_registry.py"
      - "backend/scripts/collect_press_feeds.py"
      - "backend/scripts/collect_periodicals.py"
      - "backend/scripts/publish_periodicals.py"
      - ".github/workflows/periodicals.yml"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-periodicals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Restore periodical state and archive
        uses: actions/cache@v4
        with:
          path: |
            backend/periodicals/state.json
            backend/periodicals/archive.json
            backend/public/data/press-registry-health.json
          key: periodicals-v2-${{ github.run_id }}
          restore-keys: |
            periodicals-v2-

      - name: Monitor registered press sites and discover RSS
        working-directory: backend
        run: python -m scripts.monitor_press_registry

      - name: Collect articles from discovered RSS feeds
        working-directory: backend
        run: python -m scripts.collect_press_feeds

      - name: Collect public Telegram PDFs
        working-directory: backend
        run: python -m scripts.collect_periodicals

      - name: Build Persian periodical cards
        working-directory: backend
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL_STRONG: ${{ secrets.AI_MODEL_STRONG }}
        run: python -m scripts.publish_periodicals

      - name: Find latest successful full site build
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh run list --workflow build.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download latest static site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ steps.base.outputs.run_id }}" -n latest-static-site -D site

      - name: Overlay Jan-e Jarayed data and current UI
        run: |
          # Keep the generated data from this run, but always ship the current UI.
          rsync -a --exclude 'data/' web-static/ site/
          mkdir -p site/data
          cp backend/public/data/periodicals.json site/data/periodicals.json
          cp backend/public/data/press-registry-health.json site/data/press-registry-health.json
          if [ -d backend/web-static/assets/periodicals ]; then
            mkdir -p site/assets/periodicals
            cp -R backend/web-static/assets/periodicals/. site/assets/periodicals/
          fi
          python - <<'PY'
          import hashlib, pathlib, re
          root = pathlib.Path("site")
          versions = {}
          for name in ("app.js", "styles.css", "iran-provinces.js"):
              p = root / name
              if p.exists():
                  versions[name] = hashlib.md5(p.read_bytes()).hexdigest()[:8]
          idx = root / "index.html"
          text = idx.read_text(encoding="utf-8")
          for name, version in versions.items():
              text = re.sub(
                  r'((?:src|href)="' + re.escape(name) + r')(?:\?v=[0-9a-f]+)?(")',
                  r'\1?v=' + version + r'\2',
                  text,
              )
          idx.write_text(text, encoding="utf-8")
          sw = root / "sw.js"
          app_v = versions.get("app.js")
          if sw.exists() and app_v:
              s = sw.read_text(encoding="utf-8")
              s = re.sub(r'const V = "[^"]*";', f'const V = "jankalam-{app_v}";', s, count=1)
              sw.write_text(s, encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: periodical-diagnostics-${{ github.run_id }}
          path: |
            backend/periodicals/articles.json
            backend/periodicals/site_articles_diag.json
            backend/periodicals/quarantine.json
            backend/periodicals/archive.json
            backend/public/data/press-registry-health.json
          if-no-files-found: ignore
          retention-days: 3

  deploy:
    needs: build-periodicals
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
