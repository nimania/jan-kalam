name: Collect Telegram periodicals

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: telegram-periodicals
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collector dependencies
        working-directory: backend
        run: pip install "pypdf>=5.0"
      - name: Restore collector state
        uses: actions/cache@v4
        with:
          path: backend/periodicals/state.json
          key: periodicals-state-${{ github.run_id }}
          restore-keys: |
            periodicals-state-
      - name: Collect new PDFs from public Telegram previews\n        working-directory: backend\n        run: python -m scripts.collect_periodicals
      - name: Save extracted candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: periodical-candidates-${{ github.run_id }}
          path: |\n            backend/periodicals/articles.json\n            backend/periodicals/quarantine.json
          if-no-files-found: ignore
          retention-days: 3
