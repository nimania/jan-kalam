name: Fast Deploy Jan Kalam UI\n# Also publishes seeded Jan-e Jaraid data under web-static/data.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web-static/**"
      - ".github/workflows/fast-deploy.yml"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ui
  cancel-in-progress: true

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find freshest successful site artifact
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?status=success&per_page=1")"
          press_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/periodicals.yml/runs?status=success&per_page=1")"
          build_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$build_json")"
          build_at="$(jq -r '.workflow_runs[0].updated_at // empty' <<<"$build_json")"
          press_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$press_json")"
          press_at="$(jq -r '.workflow_runs[0].updated_at // empty' <<<"$press_json")"
          if [ -n "$press_id" ] && { [ -z "$build_id" ] || [[ "$press_at" > "$build_at" ]]; }; then
            echo "run_id=$press_id" >> "$GITHUB_OUTPUT"
            echo "source=periodicals" >> "$GITHUB_OUTPUT"
          else
            test -n "$build_id"
            echo "run_id=$build_id" >> "$GITHUB_OUTPUT"
            echo "source=build" >> "$GITHUB_OUTPUT"
          fi
      - name: Download freshest complete static site
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.refresh.outputs.run_id }}
          SOURCE: ${{ steps.refresh.outputs.source }}
        run: |
          rm -rf site && mkdir -p site
          ok=0
          if [ "$SOURCE" = "periodicals" ]; then
            rm -rf pages-archive && mkdir -p pages-archive
            if gh run download "$RUN_ID" -n github-pages -D pages-archive && [ -f pages-archive/artifact.tar ]; then
              tar -xf pages-archive/artifact.tar -C site
              ok=1
            fi
          else
            if gh run download "$RUN_ID" -n latest-static-site -D site; then
              ok=1
            fi
          fi
          if [ "$ok" -ne 1 ]; then
            echo "::warning::Fresh site artifact unavailable; falling back to repository seed."
            cp -a web-static/. site/
          fi
      - name: Overlay current UI without overwriting generated data
        run: |
          # Generated datasets (especially Jan-e Jaraid) belong to collector/build
          # artifacts. A UI hotfix must never replace them with seeded repo data.
          rsync -a --exclude 'data/' web-static/ site/
          python - <<'PY'
          import hashlib, pathlib, re
          root = pathlib.Path("site")
          versions = {}
          for name in ("app.js", "styles.css", "iran-provinces.js"):
              p = root / name
              if p.exists():
                  versions[name] = hashlib.md5(p.read_bytes()).hexdigest()[:8]
          idx = root / "index.html"
          text = idx.read_text(encoding="utf-8")
          for name, version in versions.items():
              text = re.sub(
                  r'((?:src|href)="' + re.escape(name) + r')(?:\?v=[0-9a-f]+)?(")',
                  r'\1?v=' + version + r'\2',
                  text,
              )
          idx.write_text(text, encoding="utf-8")
          sw = root / "sw.js"
          app_v = versions.get("app.js")
          if sw.exists() and app_v:
              s = sw.read_text(encoding="utf-8")
              s = re.sub(r'const V = "[^"]*";', f'const V = "jankalam-{app_v}";', s, count=1)
              sw.write_text(s, encoding="utf-8")
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site

  deploy:
    needs: build-ui
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
