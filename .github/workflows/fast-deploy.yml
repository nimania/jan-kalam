name: Fast Deploy Jan Kalam UI\n# Also publishes seeded Jan-e Jaraid data under web-static/data.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web-static/**"
      - ".github/workflows/fast-deploy.yml"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ui
  cancel-in-progress: true

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find latest successful build and periodicals runs
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          press_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/periodicals.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          test -n "$build_id"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "press_id=$press_id" >> "$GITHUB_OUTPUT"

      - name: Download latest complete static site
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ steps.refresh.outputs.build_id }}
        run: |
          rm -rf site && mkdir -p site
          gh run download "$BUILD_ID" -n latest-static-site -D site

      - name: Overlay freshest Jan-e Jaraid generated data
        env:
          GH_TOKEN: ${{ github.token }}
          PRESS_ID: ${{ steps.refresh.outputs.press_id }}
        run: |
          if [ -z "$PRESS_ID" ]; then
            echo "::warning::No successful periodicals run found; keeping build data."
            exit 0
          fi
          rm -rf /tmp/press-pages && mkdir -p /tmp/press-pages
          if gh run download "$PRESS_ID" -n github-pages -D /tmp/press-pages && [ -f /tmp/press-pages/artifact.tar ]; then
            rm -rf /tmp/press-site && mkdir -p /tmp/press-site
            tar -xf /tmp/press-pages/artifact.tar -C /tmp/press-site
            mkdir -p site/data
            for name in periodicals.json press-directory.json press-directory.js press-registry-health.json; do
              if [ -f "/tmp/press-site/data/$name" ]; then
                cp "/tmp/press-site/data/$name" "site/data/$name"
              fi
            done
            if [ -d /tmp/press-site/assets/periodicals ]; then
              mkdir -p site/assets/periodicals
              rsync -a /tmp/press-site/assets/periodicals/ site/assets/periodicals/
            fi
          else
            echo "::warning::Could not download latest periodicals Pages artifact; keeping build data."
          fi
          # Guarantee a synchronous manifest even when the selected historical
          # periodicals artifact predates press-directory.js.
          if [ -f site/data/press-directory.json ]; then
            python - <<'PY'
          import json, pathlib
          p=pathlib.Path("site/data/press-directory.json")
          rows=json.loads(p.read_text(encoding="utf-8"))
          pathlib.Path("site/data/press-directory.js").write_text(
              "window.__PRESS_DIRECTORY__="+json.dumps(rows,ensure_ascii=False,separators=(",",":"))+";\n",
              encoding="utf-8",
          )
          PY
          fi

      - name: Overlay current UI without overwriting generated data
        run: |
          # Generated datasets (especially Jan-e Jaraid) belong to collector/build
          # artifacts. A UI hotfix must never replace them with seeded repo data.
          rsync -a --exclude 'data/' web-static/ site/
          python - <<'PY'
          import hashlib, pathlib, re
          root = pathlib.Path("site")
          versions = {}
          for name in ("app.js", "styles.css", "iran-provinces.js", "data/press-directory.js"):
              p = root / name
              if p.exists():
                  versions[name] = hashlib.md5(p.read_bytes()).hexdigest()[:8]
          idx = root / "index.html"
          text = idx.read_text(encoding="utf-8")
          for name, version in versions.items():
              text = re.sub(
                  r'((?:src|href)="' + re.escape(name) + r')(?:\?v=[0-9a-f]+)?(")',
                  r'\1?v=' + version + r'\2',
                  text,
              )
          idx.write_text(text, encoding="utf-8")
          sw = root / "sw.js"
          app_v = versions.get("app.js")
          if sw.exists() and app_v:
              s = sw.read_text(encoding="utf-8")
              s = re.sub(r'const V = "[^"]*";', f'const V = "jankalam-{app_v}";', s, count=1)
              sw.write_text(s, encoding="utf-8")
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site

  deploy:
    needs: build-ui
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
