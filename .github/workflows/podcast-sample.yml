name: Podcast sample (manual test)

# Test only: turns podcast/sample_script.txt into MP3 samples with two
# Persian voices. Runs only when started by hand from the Actions tab.
on:
  workflow_dispatch: {}

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install edge-tts
        run: pip install edge-tts
      - name: Generate samples
        run: |
          mkdir -p out
          for v in fa-IR-DilaraNeural fa-IR-FaridNeural; do
            edge-tts --voice "$v" -f podcast/sample_script.txt --write-media "out/jankalam-sample-${v}.mp3"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: jankalam-podcast-sample
          path: out/
